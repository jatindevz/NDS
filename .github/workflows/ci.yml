name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nds
        options: >-
          --health-cmd "pg_isready -U postgres -d nds"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # CI services are isolated per-job containers; no passwords needed.
      TEST_REDIS_URL: redis://localhost:6379
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nds
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nds

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Fail if integration tests were skipped
        if: matrix.node == 20
        run: |
          npx vitest run --project integration --reporter=json --outputFile=/tmp/results.json
          UNREACHABLE=$(node -e "const r=require('/tmp/results.json');console.log(r.testResults.flatMap(t=>t.assertionResults).some(a=>a.status==='passed'&&a.ancestorTitles.some(x=>x.includes('redis not reachable'))))")
          if [ "$UNREACHABLE" = "true" ]; then
            echo "::error::Integration tests were skipped — Redis service likely unhealthy"
            exit 1
          fi
